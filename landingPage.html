<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Horizon | Beyond the Unknown</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
    --accent: #ff4d00;
    --glass: rgba(255, 255, 255, 0.05);
    --border: rgba(255, 255, 255, 0.1);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html { scroll-behavior: smooth; }

body {
    font-family: 'Inter', sans-serif;
    background-color: #050505;
    color: #fff;
    overflow-x: hidden;
}

/* Background */
.hero-bg {
    position: fixed;
    inset: 0;
    background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.8)),
                url('/sources/landingPage.jpg') no-repeat center center;
    background-size: cover;
    z-index: -1;
    animation: slowZoom 20s infinite alternate ease-in-out;
}

@keyframes slowZoom {
    from { transform: scale(1); }
    to { transform: scale(1.1); }
}

/* NAV */
nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem 10%;
    background: var(--glass, rgba(255,255,255,0.05));
    backdrop-filter: blur(15px);
    border-bottom: 1px solid var(--border, rgba(255,255,255,0.1));
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 100;
}

.logo {
    font-family: 'Syncopate', sans-serif;
    font-weight: 700;
    letter-spacing: 6px;
    text-transform: uppercase;
    font-size: 1rem;
    background: linear-gradient(to right, #fff, var(--accent));

    /* Standard */
    background-clip: text;
    color: transparent;

    /* Webkit */
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.nav-links {
    list-style: none;
    display: flex;
    gap: 3rem;
}

.nav-links a {
    text-decoration: none;
    color: rgba(255,255,255,0.6);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.nav-links a:hover { color: #fff; }

/* SECTIONS */
section {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 100px 10%;
}

#home { text-align: center; }

h1 {
    font-family: 'Syncopate', sans-serif;
    font-size: clamp(2.5rem, 8vw, 5rem);
    letter-spacing: 15px;
    margin-bottom: 2rem;
}

/* ABOUT */
.section-title {
    font-family: 'Syncopate', sans-serif;
    font-size: 2rem;
    letter-spacing: 8px;
    margin-bottom: 3rem;
    color: var(--accent);
}

.about-container {
    background: var(--glass);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    padding: 3rem;
    max-width: 900px;
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    gap: 40px;
}

.profile-img {
    width: 100%;
    aspect-ratio: 1;
    border: 1px solid var(--accent);

    background-image: url('/sources/profileImage.png');
    background-size: cover;
    background-position: center;
}

/* TEXT */
.about-text p {
    line-height: 1.8;
    color: rgba(255,255,255,0.8);
}

/* STATS */
.stats {
    display: flex;
    gap: 20px;
    margin-top: 20px;
}

.stat-item {
    border-left: 2px solid var(--accent);
    padding-left: 15px;
}

/* BUTTONS */
.cta-button {
    padding: 1.2rem 3rem;
    border: 1px solid var(--border);
    text-transform: uppercase;
    letter-spacing: 4px;
    text-decoration: none;
    color: #fff;
}

.cta-button:hover {
    border-color: var(--accent);
}

/* GRID */
.expedition-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
}

.data-card {
    border: 1px solid var(--border);
    padding: 2rem;
}

.tech-label {
    font-size: 0.6rem;
    color: var(--accent);
}

/* FOOTER */
.bottom-bar {
    position: fixed;
    bottom: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 60px;
    padding: 15px;
    font-size: 0.65rem;
    background: rgba(0,0,0,0.8);
}

/* MOBILE */
@media (max-width: 768px) {
    .about-container { grid-template-columns: 1fr; }
    .nav-links { display: none; }
}
</style>
</head>

<body>

<div class="hero-bg"></div>

<nav>
    <div class="logo">MultiMedia</div>
    <ul class="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#about">The Pilot</a></li>
        <li><a href="#expedition">About</a></li>
    </ul>
</nav>

<section id="home">
    <h1>My Portfolio</h1>
    <a href="rotoscope.html" class="cta-button">Rotoscope</a>
    <a href="solarSystem.html" class="cta-button">Solar System</a>
</section>

<section id="about">
    <h2 class="section-title">Personnel Profile</h2>
    <div class="about-container">
        <div class="profile-img"></div>
        <div class="about-text">
            <p><strong>IDENTIFICATION:</strong> Elijah Neil S. Gallardo</p>
            <p>I create digital experiences combining design and technology.</p>
        </div>
    </div>
</section>

</body>
</html>
