<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extraction Logs | Rotoscoping</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
    --accent: #ff4d00;
    --glass: rgba(255, 255, 255, 0.05);
    --border: rgba(255, 255, 255, 0.1);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    background-color: #050505;
    color: #fff;
    overflow-x: hidden;
}

/* Background */
.hero-bg {
    position: fixed;
    inset: 0;
    background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),
                url('/sources/landingpage.jpg') no-repeat center center;
    background-size: cover;
    z-index: -1;
    filter: grayscale(0.5) brightness(0.3);
}

/* NAV */
nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem 10%;
    background: var(--glass, rgba(255,255,255,0.05));
    backdrop-filter: blur(15px);
    border-bottom: 1px solid var(--border, rgba(255,255,255,0.1));
    position: fixed;
    width: 100%;
    top: 0;
}

.logo {
    font-family: 'Syncopate', sans-serif;
    font-weight: 700;
    letter-spacing: 6px;
    text-transform: uppercase;
    font-size: 1rem;
    background: linear-gradient(to right, #fff, var(--accent, #ff4d00));

    /* Standard */
    background-clip: text;
    color: transparent;

    /* Webkit */
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.back-link {
    text-decoration: none;
    color: var(--accent, #ff4d00);
    font-size: 0.7rem;
}

/* SECTION */
section {
    padding: 150px 10% 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.section-title {
    font-family: 'Syncopate', sans-serif;
    letter-spacing: 10px;
}

.subtitle {
    color: var(--accent, #ff4d00);
}

/* VIDEO GRID */
.video-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 300px));
    gap: 40px;
    justify-content: center;
}

.video-card {
    background: var(--glass, rgba(255,255,255,0.05));
    border: 1px solid var(--border, rgba(255,255,255,0.1));
    padding: 15px;
    backdrop-filter: blur(10px);
    transition: transform 0.4s ease;
}

.video-card:hover {
    transform: translateY(-10px);
    border-color: var(--accent, #ff4d00);
}

.video-card::before {
    content: "DATA_STREAM";
    color: var(--accent, #ff4d00);
}

/* VIDEO */
.iframe-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 9 / 16;
}

iframe {
    position: absolute;
    width: 100%;
    height: 100%;
    border: 0;
}

/* TEXT */
.video-info p {
    color: rgba(255,255,255,0.6);
}

/* FOOTER */
.bottom-bar {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: rgba(0,0,0,0.8);
}
</style>
</head>

<body>

<div class="hero-bg"></div>

<nav>
    <a href="landingPage.html" class="logo">MultiMedia</a>
    <a href="landingPage.html" class="back-link">// Return to Base</a>
</nav>

<section>
    <h1 class="section-title">Extraction Logs</h1>
    <p class="subtitle">Manual Frame Manipulation // Portfolio</p>

    <div class="video-container">

        <div class="video-card">
            <div class="iframe-wrapper">
                <iframe src="https://www.youtube-nocookie.com/embed/nqJraaiPxsA"></iframe>
            </div>
            <div class="video-info">
                <h3>Week 1</h3>
                <p>I extracted the frames and manually traced each one.</p>
            </div>
        </div>

        <div class="video-card">
            <div class="iframe-wrapper">
                <iframe src="https://www.youtube-nocookie.com/embed/Q7pe6lhf3ZY"></iframe>
            </div>
            <div class="video-info">
                <h3>Week 2</h3>
                <p>I extracted the frames and manually traced each one.</p>
            </div>
        </div>

    </div>
</section>

<div class="bottom-bar"></div>

</body>
</html>
