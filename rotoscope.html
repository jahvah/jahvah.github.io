<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extraction Logs | Rotoscoping</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #ff4d00;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Fixed Background to match main page */
        .hero-bg {
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), 
                        url('sources/landingpage.jpg') no-repeat center center;
            background-size: cover;
            z-index: -1;
            filter: grayscale(0.5) brightness(0.3);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 10%;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Syncopate', sans-serif;
            font-weight: 700;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-size: 1rem;
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-link {
            text-decoration: none;
            color: var(--accent);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .back-link:hover {
            letter-spacing: 4px;
            text-shadow: 0 0 10px var(--accent);
        }

        section {
            padding: 150px 10% 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .section-title {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            letter-spacing: 10px;
            margin-bottom: 1rem;
            text-transform: uppercase;
            text-align: center;
        }

        .subtitle {
            color: var(--accent);
            letter-spacing: 4px;
            font-size: 0.8rem;
            margin-bottom: 4rem;
            text-transform: uppercase;
        }

        /* Video Grid */
    .video-container {
    display: grid;
    /* Changed minmax from 300px to 220px to allow smaller sizing */
    grid-template-columns: repeat(auto-fit, minmax(220px, 300px)); 
    gap: 40px;
    width: 100%;
    max-width: 1100px;
    justify-content: center; /* Keeps the grid centered */
}

    .video-card {
    background: var(--glass);
    border: 1px solid var(--border);
    padding: 15px; /* Slightly reduced padding */
    backdrop-filter: blur(10px);
    position: relative;
    transition: transform 0.4s ease;
    max-width: 280px; /* Adjust this value to set your preferred size */
    margin: 0 auto; /* Centers cards if they wrap */
}
        .video-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent);
        }

        .video-card::before {
            content: "DATA_STREAM";
            position: absolute;
            top: -10px;
            left: 20px;
            background: #050505;
            padding: 0 10px;
            font-size: 0.6rem;
            color: var(--accent);
            letter-spacing: 2px;
        }

        .iframe-wrapper {
            position: relative;
            width: 100%;
            /* Aspect ratio for Shorts/Portrait (9:16) */
            aspect-ratio: 9 / 16; 
            overflow: hidden;
            background: #000;
            border: 1px solid rgba(255,255,255,0.05);
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-info {
            margin-top: 1.5rem;
        }

        .video-info h3 {
            font-family: 'Syncopate', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .video-info p {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.6);
            line-height: 1.6;
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 60px;
            padding: 15px;
            font-size: 0.65rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            border-top: 1px solid var(--border);
        }

        @media (max-width: 768px) {
            .video-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="hero-bg"></div>

    <nav>
        <a href="landingPage.html" class="logo">MultiMedia</a>
        <a href="landingPage.html" class="back-link">// Return to Base</a>
    </nav>

    <section>
        <h1 class="section-title">Extraction Logs</h1>
        <p class="subtitle">Manual Frame Manipulation // Portfolio</p>

        <div class="video-container">
            <!-- Video 01 -->
            <div class="video-card">
                <div class="iframe-wrapper">
                    <iframe 
                        src="https://www.youtube-nocookie.com/embed/nqJraaiPxsA" 
                        title="Rotoscope Work 01" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                    </iframe>
                </div>
                <div class="video-info">
                    <h3>Week 1</h3>
                    <p>I extracted the frames and manually traced each one.</p>
                </div>
            </div>

            <!-- Video 02 -->
            <div class="video-card">
                <div class="iframe-wrapper">
                    <iframe 
                        src="https://www.youtube-nocookie.com/embed/Q7pe6lhf3ZY" 
                        title="Rotoscope Work 02" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                    </iframe>
                </div>
                <div class="video-info">
                    <h3>Week 2</h3>
                    <p>I extracted the frames and manually traced each one.</p>
                </div>
            </div>
        </div>
    </section>

    <div class="bottom-bar">
        <span><strong>STATUS:</strong> VIEWING_MODE</span>
        <span><strong>CODE:</strong> ROTO_DEPT_04</span>
    </div>

</body>
</html>
